function makeDailyMission(){const day=localDayKey(),idx=Math.floor(new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()).getTime()/86400000)%dailyMissionDefs.length;return {...dailyMissionDefs[idx],date:day,progress:0,claimed:false}}

function currentWeaponSupportsElements(){return ['bow','staff'].includes(player.weaponType||weaponTypeOf(equipment.weapon))}
function cycleWeaponElement(){
 const type=player.weaponType||weaponTypeOf(equipment.weapon);
 if(!['bow','staff'].includes(type)){log('속성 공격은 활 또는 지팡이를 장착해야 사용할 수 있습니다.','warn');return}
 const order=['normal','fire','ice','storm'];let index=order.indexOf(weaponElement);
 for(let step=1;step<=order.length;step++){
  const next=order[(index+step)%order.length];
  if(type==='bow'&&next!=='normal'&&(elementAmmo[next]||0)<=0)continue;
  weaponElement=next;updateHud();saveGame(false);
  log(`${weaponElements[next].icon} ${weaponElements[next].label} ${type==='bow'&&next!=='normal'?`화살 ${fmt(elementAmmo[next])}발`:'속성 모드'} 선택`,'gold');return;
 }
 weaponElement='normal';updateHud();
}
function activeElementForAttack(type){
 if(!['bow','staff'].includes(type))return 'normal';
 if(type==='bow'&&weaponElement!=='normal'&&(elementAmmo[weaponElement]||0)<=0){weaponElement='normal';updateHud();return 'normal'}
 return weaponElement;
}

}

function interactTownNpc(id=null){if(worldMode!=='town'){log('먼저 마을로 귀환하세요.','warn');return}let chosen=id?id:Object.entries(townNpcDefs).sort((a,b)=>Math.abs(a[1].x-player.x)-Math.abs(b[1].x-player.x))[0]?.[0];const npc=townNpcDefs[chosen];if(!npc)return;if(Math.abs(player.x-npc.x)>135){townWalkTarget=npc.x;pendingTownNpc=chosen;faceToward(npc.x);log(`${npc.name}에게 이동합니다.`,'gold');return}townWalkTarget=null;pendingTownNpc=null;if(chosen==='inn'){showModal('여관 주인 아린','따뜻한 식사와 잠자리로 몸을 회복할 수 있습니다.<br><br><b>휴식 비용: 45 G</b><br>HP와 MP를 모두 회복합니다.',[['나중에',closeModal],['휴식하기',townRest,'primary']]);return}if(chosen==='merchant'){setTab('shop');return}if(chosen==='pet'){setTab('pets');return}if(chosen==='smith'){const buttons=[['취소',closeModal],...['sword','bow','staff','dagger','axe','spear'].map(k=>[`${weaponArchetypes[k].icon} ${weaponArchetypes[k].label}`,()=>townCraftWeapon(k)])];showModal('대장장이 로크','원하는 무기 계열의 희귀 장비를 제작합니다.<br><br><b>제작 비용: 680 G · 분해 가루 12 · 잿불 2</b><br>제작한 무기는 가방에 들어갑니다.',buttons);return}if(chosen==='board'){if(townQuest.claimed){showModal('원정 의뢰 게시판','이번 의뢰의 보상은 이미 수령했습니다. 다시 수락하면 새로운 사냥 의뢰를 시작합니다.',[['닫기',closeModal],['새 의뢰 수락',()=>{closeModal();acceptTownQuest()} ,'primary']]);return}if(townQuest.active&&townQuest.progress>=townQuest.target){showModal('원정 의뢰 완료',`목표 달성!<br>보상: <b>800 G · 분해 가루 25 · 잿불 2</b>`,[['닫기',closeModal],['보상 수령',claimTownQuest,'primary']]);return}if(townQuest.active){showModal('원정 의뢰 진행 중',`황야 몬스터 처치<br><b>${townQuest.progress} / ${townQuest.target}</b><br><br>목표를 완료한 뒤 다시 게시판을 찾아오세요.`,[['확인',closeModal]]);return}showModal('새 원정 의뢰','황야 몬스터 12마리를 처치하세요.<br><br>보상: <b>800 G · 분해 가루 25 · 잿불 2</b>',[['나중에',closeModal],['의뢰 수락',()=>{closeModal();acceptTownQuest()},'primary']]);}}
function townRest(){closeModal();if(player.gold<45){log('휴식 비용 45 G가 부족합니다.','warn');return}player.gold-=45;player.hp=player.maxHp;player.mp=player.maxMp;updateHud();saveGame(false);log('여관에서 충분히 쉬었습니다. HP와 MP가 모두 회복되었습니다.','loot')}
function buyTownGoods(kind){const cost=kind==='potions'?250:140;if(player.gold<cost){log('골드가 부족합니다.','warn');return}player.gold-=cost;if(kind==='potions')player.potions+=5;else if(['fire','ice','storm'].includes(kind))elementAmmo[kind]=(elementAmmo[kind]||0)+25;renderPanel();updateHud();saveGame(false);log(kind==='potions'?'회복 물약 5개를 보급했습니다.':`${weaponElements[kind].label} 화살 25발을 보급했습니다.`,'loot')}
function townCraftWeapon(type){closeModal();if(!weaponArchetypes[type])return;if(player.gold<680||materials.dust<12||materials.ember<2){log('제작 재료가 부족합니다.','warn');return}if(bag.length>=100){log('가방이 가득 찼습니다. 먼저 정리하세요.','warn');return}player.gold-=680;materials.dust-=12;materials.ember-=2;const item=createGear('weapon','rare',type);bag.unshift(item);updateStats();renderPanel();updateHud();saveGame(false);log(`대장장이 제작 완료 · ${item.name}`,'loot');showToast('WEAPON FORGED',`${weaponArchetypes[type].label} · ${item.name}`,1700)}
function acceptTownQuest(){townQuest={active:true,progress:0,target:12,claimed:false};renderPanel();saveGame(false);log('원정 의뢰 수락 · 몬스터 12마리를 처치하세요.','gold')}
function claimTownQuest(){if(!townQuest.active||townQuest.progress<townQuest.target||townQuest.claimed){closeModal();return}closeModal();townQuest.active=false;townQuest.claimed=true;player.gold+=800;materials.dust+=25;materials.ember+=2;renderPanel();updateHud();saveGame(false);showToast('QUEST REWARD','800 G · 가루 25 · 잿불 2',1800);log('원정 의뢰 보상을 수령했습니다.','loot')}
function claimDailyMission(){const dm=ensureDailyMission();if(dm.claimed||dm.progress<dm.target){log('일일 임무를 아직 완료하지 않았습니다.','warn');return}dm.claimed=true;player.gold+=dm.gold;materials.dust+=dm.dust;materials.ember+=dm.ember;materials.core+=dm.core;renderPanel();updateHud();saveGame(false);showToast('DAILY REWARD',`${fmt(dm.gold)} G · 가루 ${dm.dust} · 잿불 ${dm.ember} · 핵 ${dm.core}`,2200);log(`일일 임무 보상 수령 · ${dm.title}`,'loot')}

 house(70,245,170,150,'#493a35');house(370,225,205,170,'#584337');house(720,250,170,145,'#493a35');

 for(const x of [275,690]){ctx.fillStyle='#503b2b';ctx.fillRect(x,FLOOR-50,5,50);ctx.fillRect(x+28,FLOOR-50,5,50);ctx.fillRect(x-4,FLOOR-39,41,4);ctx.fillRect(x-4,FLOOR-18,41,4)}

function renderPanel(){const p=$('panel');p.innerHTML='';if(activeTab==='town')renderTownPanel(p);if(activeTab==='character')renderCharacter(p);if(activeTab==='growth')renderGrowth(p);if(activeTab==='equipment')renderEquipment(p);if(activeTab==='skills')renderSkills(p);if(activeTab==='shop')renderShop(p);if(activeTab==='stages')renderStages(p);if(activeTab==='codex')renderCodex(p);if(activeTab==='dungeon')renderDungeon(p);if(activeTab==='pets')renderPets(p)}

function renderTownPanel(p){
 const q=townQuest||{active:false,progress:0,target:12,claimed:false};
 const pct=q.active?Math.min(100,Math.floor((q.progress/q.target)*100)):0;
 p.innerHTML=`<div class="section"><h3>재의 마을 · 안전지대</h3><div class="note">사냥터에서 얻은 재료를 정리하고 다음 원정을 준비하는 작은 거점입니다. 마을에서는 몬스터가 공격하지 않으며, 사냥 진행 상황은 그대로 보존됩니다.</div><div class="town-service-grid"><div class="town-service"><b>♨ 여관 아린</b><small>골드로 HP와 MP를 완전히 회복합니다.</small></div><div class="town-service"><b>◇ 상인 벨</b><small>물약, 속성 화살과 원정 보급품을 판매합니다.</small></div><div class="town-service"><b>⚒ 대장장이 로크</b><small>분해 재료로 원하는 계열의 희귀 무기를 제작합니다.</small></div><div class="town-service"><b>▤ 의뢰 게시판</b><small>몬스터 12마리 처치 의뢰를 수락하고 보상을 받습니다.</small></div><div class="town-service"><b>🐾 조련사 루나</b><small>펫을 입양하고 함께 성장시킵니다.</small></div><div class="town-service"><b>⛓ 봉인 던전</b><small>여러 전투 방과 전용 보스에 도전합니다.</small></div></div><button class="primary" style="width:100%;margin-top:10px" onclick="leaveTown()">사냥터로 복귀</button></div>
 <div class="section"><h3>초보 원정 의뢰</h3>${q.claimed?'<span class="town-badge">이번 의뢰 보상 수령 완료</span><div class="note" style="margin-top:7px">새 의뢰는 게시판에서 다시 수락할 수 있습니다.</div>':q.active?`<div class="row"><span>황야 몬스터 처치</span><b>${q.progress} / ${q.target}</b></div><div class="town-quest-track"><i style="width:${pct}%"></i></div><div class="itemDesc">보상: 800 G · 분해 가루 25 · 잿불 2</div>${q.progress>=q.target?'<button class="primary" style="width:100%;margin-top:8px" onclick="claimTownQuest()">의뢰 보상 수령</button>':'<div class="note" style="margin-top:7px">사냥터에서 몬스터를 처치하면 자동으로 진행됩니다.</div>'}`:'<div class="itemDesc">첫 원정 준비를 위해 몬스터 12마리를 처치하세요.</div><div class="itemActions"><button class="primary" onclick="acceptTownQuest()">의뢰 수락</button></div>'}</div>
 <div class="section"><h3>오늘의 일일 임무 · ${ensureDailyMission().date}</h3>${(()=>{const dm=ensureDailyMission(),dp=Math.floor(dm.progress/dm.target*100);return `<div class="itemHead"><span>${dm.title}</span><span class="town-badge">${dm.claimed?'보상 수령 완료':dm.progress>=dm.target?'완료':'진행 중'}</span></div><div class="itemDesc">${dm.desc}</div><div class="row"><span>진행도</span><b>${dm.progress} / ${dm.target}</b></div><div class="town-quest-track"><i style="width:${dp}%"></i></div><div class="itemDesc">보상: ${fmt(dm.gold)} G · 가루 ${dm.dust} · 잿불 ${dm.ember} · 핵 ${dm.core}</div>${dm.progress>=dm.target&&!dm.claimed?'<button class="primary" style="width:100%;margin-top:8px" onclick="claimDailyMission()">일일 보상 받기</button>':''}`})()}</div><div class="section"><h3>원정 준비 현황</h3>${row('현재 지역',`${game.stage}. ${stageInfo().name}`)}${row('현재 무기',weaponArchetypes[player.weaponType||'sword'].label)}${row('보유 물약',`${player.potions}개`)}${row('화염 / 빙결 / 번개 화살',`${fmt(elementAmmo.fire)} / ${fmt(elementAmmo.ice)} / ${fmt(elementAmmo.storm)}`)}${row('보유 장비',`${bag.length} / 100`)}</div>`;
}

function renderCharacter(p){
 const selected=heroProgress.classId?heroClassDefs[heroProgress.classId]:null,tier=Number(heroProgress.tier)||0;
 const classPanel=selected?`<div class="section class-awakening"><h3>${selected.icon} 전직 · ${selected.name}</h3><div class="class-summary">${selected.desc}</div><div class="row"><span>현재 단계</span><b>${classTierNames[tier]}</b></div><div class="row"><span>전직 효과</span><b>${selected.bonus}</b></div>${tier<3?`<div class="promotion-cost"><b>다음 승급 · ${classTierNames[tier+1]}</b><small>요구 레벨 ${tier===1?25:40} · ${tier===1?'4,200 G / 가루 80 / 잿불 7':'14,500 G / 가루 230 / 잿불 22 / 핵 4'}</small><button class="smallbtn primary" onclick="advanceHeroClass()" ${player.level<(tier===1?25:40)?'disabled':''}>전직 승급</button></div>`:'<div class="note gold">최종 각성 완료</div>'}</div>`:`<div class="section class-awakening"><h3>영웅 전직 · Lv.10 해금</h3><div class="note">레벨 10에 전투 계열을 선택하세요. 전직 후 레벨 25와 40에서 두 번 더 승급하며, 직업에 맞는 능력치와 궁극기 보너스를 얻습니다.</div><div class="class-choice-grid">${Object.values(heroClassDefs).map(d=>`<div class="class-choice"><b>${d.icon} ${d.name}</b><small>${d.role}</small><p>${d.desc}</p><button class="smallbtn primary" onclick="chooseHeroClass('${d.id}')" ${player.level<10?'disabled':''}>${player.level<10?'Lv.10 필요':'전직 선택'}</button></div>`).join('')}</div></div>`;
