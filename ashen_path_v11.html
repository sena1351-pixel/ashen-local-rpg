/* Skill archive / loadout UI v1.0 */
.skill-overview{background:linear-gradient(135deg,#1d2a3a,#17202c 62%,#27251e);border:1px solid #46566a;border-radius:9px;padding:11px;margin-bottom:10px}
.skill-overview-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}
.skill-overview-title{font-weight:800;color:#f2d28e;font-size:13px;letter-spacing:.4px}
.skill-overview-sub{font-size:10px;color:#a9b7c9;margin-top:2px}
.skill-resource{font-size:10px;color:#c5d1df;text-align:right;line-height:1.6}
.skill-loadout{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.skill-slot{position:relative;min-width:0;min-height:73px;background:#0f1722;border:1px solid #45566e;border-radius:8px;padding:6px 3px;text-align:center;cursor:pointer;overflow:hidden}
.skill-slot.active{border-color:#d0a04d;box-shadow:inset 0 0 0 1px #d0a04d55;background:#29251d}
.skill-slot.empty{border-style:dashed;opacity:.72}
.skill-slot-key{position:absolute;left:5px;top:3px;font-size:9px;color:#8fa0b6;font-weight:800}
.skill-slot-icon{width:33px;height:33px;margin:8px auto 3px;display:grid;place-items:center;border:1px solid #56667c;border-radius:7px;background:linear-gradient(145deg,#394a60,#202b3b);font-size:18px;color:#f1d18e}
.skill-slot-name{display:block;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e1e8f1}
.skill-slot-cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#05090dc9;color:#fff;font-size:15px;font-weight:800}
.skill-cat-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.skill-cat-tabs button{font-size:11px;padding:8px}
.skill-layout{display:grid;grid-template-columns:1fr;gap:9px}
.skill-library,.skill-detail{border:1px solid #344357;border-radius:8px;background:#141e2b;padding:9px;min-width:0}
.skill-library-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:11px;color:#f0d18e;font-weight:800}
.skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.skill-card{display:flex;align-items:center;gap:7px;min-width:0;width:100%;padding:7px 6px;background:#1b2736;border:1px solid #3b4b60;border-radius:7px;text-align:left;color:#eaf0f7}
.skill-card.selected{border-color:#d0a04d;background:#29251e;box-shadow:inset 0 0 0 1px #d0a04d44}
.skill-card.locked{opacity:.58}
.skill-card-icon{flex:0 0 34px;width:34px;height:34px;display:grid;place-items:center;border:1px solid #56677d;border-radius:7px;background:linear-gradient(145deg,#394b61,#1e2938);font-size:17px;color:#f4d28e}
.skill-card-copy{min-width:0;flex:1}
.skill-card-copy b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skill-card-copy small{display:block;font-size:9px;color:#a7b6c8;margin-top:3px}
.skill-card-lv{font-size:9px;color:#e5c47e;white-space:nowrap}
.skill-detail{background:linear-gradient(145deg,#1b2736,#141d29)}
.skill-detail-head{display:flex;align-items:center;gap:9px;padding-bottom:8px;border-bottom:1px solid #344357}
.skill-detail-icon{width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;border:1px solid #977744;border-radius:9px;background:linear-gradient(145deg,#63502d,#29251e);color:#ffe0a0;font-size:23px}
.skill-detail-head h3{margin:0;color:#f3d28e;font-size:14px}
.skill-detail-head small{display:block;color:#a8b6c8;font-size:10px;margin-top:3px}
.skill-detail-desc{font-size:11px;line-height:1.6;color:#c7d1df;margin:9px 0}
.skill-statline{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:8px 0}
.skill-stat{padding:6px;background:#101823;border:1px solid #2e3d51;border-radius:6px}
.skill-stat span{display:block;font-size:9px;color:#94a4b9}
.skill-stat b{display:block;font-size:11px;color:#edf2f8;margin-top:2px}
.skill-action-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.skill-action-row button{flex:1;font-size:10px;padding:7px 5px;min-width:70px}
.skill-equip-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.skill-equip-grid button{font-size:9px;padding:7px 2px}
.skill-passive-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}
.skill-passive-slot{padding:7px 4px;background:#101823;border:1px solid #3a4b61;border-radius:6px;text-align:center;min-width:0}
.skill-passive-slot b{display:block;font-size:9px;color:#e4cc91}
.skill-passive-slot span{display:block;font-size:9px;color:#9eafc4;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skill-auto-toggle{display:flex;align-items:center;gap:6px;margin-top:8px;padding:7px;background:#111a26;border:1px solid #2e3e52;border-radius:6px;font-size:10px;color:#bdc8d8}
.skill-auto-toggle input{accent-color:#d1a04f}
.skill-warning{font-size:10px;color:#d8a2a2;line-height:1.5;margin-top:7px}
.skill-progress{height:5px;border-radius:5px;background:#0c121b;overflow:hidden;margin-top:6px}
.skill-progress>i{display:block;height:100%;background:linear-gradient(90deg,#96713a,#e4bd69)}
@media(max-width:480px){.skill-grid{grid-template-columns:1fr 1fr}.skill-slot{min-height:67px}.skill-card{gap:5px;padding:6px 4px}.skill-card-icon{width:30px;height:30px;flex-basis:30px}.skill-detail-icon{width:42px;height:42px;flex-basis:42px}}

function updatePlayer(dt){player.attackCD=Math.max(0,player.attackCD-dt);player.attackAnim=Math.max(0,player.attackAnim-dt);player.inv=Math.max(0,player.inv-dt);player.hurt=Math.max(0,player.hurt-dt);player.guardTime=Math.max(0,(player.guardTime||0)-dt);for(const s of Object.values(skills))s.cd=Math.max(0,s.cd-dt);player.mp=Math.min(player.maxMp,player.mp+(player.manaRegen||5.5)*dt);

 if(move){player.face=move;player.vx=move*205;player.x+=player.vx*dt;}
 else if(game.autoHunt&&!game.stageCleared){const t=closestEnemy();if(t){faceToward(t.x);if(Math.abs(t.x-player.x)>68){player.vx=player.face*135;player.x+=player.vx*dt;}else{player.vx=0;if(player.attackCD<=0)basicAttack();}}else{player.vx=0;}}

 if(game.autoHunt&&!game.stageCleared&&player.attackCD<=0){const t=closestEnemy();if(t&&Math.abs(t.x-player.x)<=92)basicAttack();}

  const t=closestEnemy();if(t&&Math.abs(t.x-player.x)<250){
   for(const slot of ['F','R','E','Q']){const id=skillLoadout[slot];if(!id||!skills[id]?.autoUse||!skillUnlocked(id)||skills[id].cd>0||player.mp<skills[id].cost)continue;if(useSkill(slot))break}
  }
 }

}

function updateEnemies(dt){for(const e of enemies){if(e.dead)continue;e.cd-=dt;e.hurt=Math.max(0,e.hurt-dt);e.flash=Math.max(0,e.flash-dt);let dx=player.x-e.x;e.face=dx<0?-1:1;if(e.type==='boss'){const ratio=e.hp/e.maxHp;const phase=ratio<=.32?3:ratio<=.68?2:1;if(phase>e.phase){e.phase=phase;e.atk=Math.floor(e.baseAtk*(phase===2?1.18:1.42));e.speed*=phase===2?1.12:1.10;log(`${enemyDefs.boss.name} · ${phase}단계 돌입!`,'warn');showToast(`BOSS PHASE ${phase}`,phase===2?'보스의 공격이 거세집니다.':'보스가 최후의 힘을 끌어냅니다.',1200)}e.specialCd-=dt;if(e.windup>0){e.windup-=dt;if(e.windup<=0)bossSpecialAttack(e)}else if(e.specialCd<=0){e.windup=1.05;e.specialCd=Math.max(3.5,6.5-e.phase*.55)}}if(e.windup<=0){if(Math.abs(dx)>e.range){e.x+=e.face*e.speed*dt}else if(e.cd<=0){enemyAttack(e);e.cd=e.type==='boss'?1.35:1.55}}e.x=clamp(e.x,70,CW-50)}}

function updateEffects(dt){for(let i=particles.length-1;i>=0;i--){let a=particles[i];a.life-=dt;a.x+=a.vx*dt;if(a.type==='blade'){for(const e of enemies){if(e.dead||a.hit.includes(e))continue;if(Math.abs(e.x-a.x)<30&&Math.abs(e.y-a.y)<55){a.hit.push(e);dealHit(e,a.mult,true)}}}else{a.y+=a.vy*dt;a.vy+=200*dt}if(a.life<=0)particles.splice(i,1)}for(let i=floating.length-1;i>=0;i--){const f=floating[i];f.life-=dt;f.y-=32*dt;if(f.life<=0)floating.splice(i,1)}}

function craftSetPiece(setId,slot){

function equipAllBest(){let changed=0;for(const [slot] of slots){const candidates=bag.filter(it=>it.slot===slot&&!it.locked).sort((a,b)=>itemScore(b)-itemScore(a));if(candidates[0]&&itemScore(candidates[0])>itemScore(equipment[slot])){const it=candidates[0],old=equipment[slot];equipment[slot]=it;bag=bag.filter(x=>x.id!==it.id);if(old)bag.unshift(old);changed++}}if(changed){updateStats();renderPanel();updateHud();saveGame(false);log(`${changed}개 슬롯의 장비를 교체했습니다.`,'loot')}else log('교체할 더 강한 장비가 없습니다.','warn')}

function rerollAffix(item,index=0){
 if(!item||item.locked){log('잠금 장비는 옵션 재련할 수 없습니다.','warn');return}
 if(!Array.isArray(item.affixes)||!item.affixes.length){log('재련할 옵션이 없습니다.','warn');return}
 if(index<0||index>=item.affixes.length)return;
 const rank=rarityRank(item.rarity),goldCost=Math.floor(260*rarity[item.rarity].mult*(1+game.stage*.035)),dustCost=12+rank*9+(item.enhance||0)*2;
 if(player.gold<goldCost||materials.dust<dustCost){log(`옵션 재련 재료 부족 · ${fmt(goldCost)}G / 가루 ${dustCost}`,'warn');return}
 const old=item.affixes[index],others=item.affixes.filter((_,i)=>i!==index),pool=affixPool.filter(a=>!others.some(o=>o.id===a.id)&&a.id!==old.id);
 if(!pool.length){log('변경할 수 있는 옵션이 없습니다.','warn');return}
 const next=pool[ri(0,pool.length-1)],scale=rarity[item.rarity].mult*(1+Math.max(0,item.level-1)*.035),value=Number(rand(next.min,next.max)*scale).toFixed(3)*1;
 player.gold-=goldCost;materials.dust-=dustCost;
 item.stats[old.stat]=Number(((item.stats[old.stat]||0)-old.value).toFixed(3));if(Math.abs(item.stats[old.stat])<.001)delete item.stats[old.stat];
 item.stats[next.stat]=Number(((item.stats[next.stat]||0)+value).toFixed(3));item.affixes[index]={id:next.id,name:next.name,stat:next.stat,value};
 updateStats();renderPanel();updateHud();saveGame(false);log(`${item.name} 옵션 재련 · ${old.name} → ${next.name}`,'loot');
}
function rerollAffixById(id,index=0){const it=findBag(id);if(it)rerollAffix(it,index)}

function renderStages(p){let current=stageInfo();const count=Math.max(10,Math.min(40,(game.unlocked||1)+2));p.innerHTML=`<div class="section"><h3>지역 / 난이도</h3><div class="note">보통 난이도에서 장비와 레벨을 갖춘 뒤 어려움·악몽으로 넘어가면 상위 등급 장비와 강화 재료를 더 많이 얻습니다.</div><div class="grid2" style="margin-top:8px">${['보통','어려움','악몽'].map((n,i)=>`<button class="smallbtn ${game.difficulty===i?'primary':''}" ${difficultyUnlocked(i)?'':'disabled'} onclick="setDifficulty(${i})">${n}${difficultyUnlocked(i)?'':' · 잠김'}</button>`).join('')}</div><div class="itemDesc" style="margin-top:7px">어려움: 스테이지 5 또는 Lv.8 · 악몽: 스테이지 10 또는 Lv.15</div></div><div class="section"><h3>목표 장비 파밍</h3><div class="note">원하는 장비 부위를 지정하면 해당 부위가 드랍될 확률이 68%로 올라갑니다. 보스 전용 유물은 해당 보스의 고정 부위로 등장합니다.</div><select id="targetSlot" onchange="setTargetSlot(this.value)" style="width:100%;margin-top:8px;background:#101722;color:#e9edf4;border:1px solid #3a4a60;border-radius:6px;padding:7px"><option value="any" ${game.targetSlot==='any'?'selected':''}>전체 부위</option>${slots.map(([k,n])=>`<option value="${k}" ${game.targetSlot===k?'selected':''}>${n} 집중 파밍</option>`).join('')}</select></div><div class="section"><h3>스테이지 선택 · 해금 ${game.unlocked}</h3>${Array.from({length:count},(_,i)=>i+1).map(id=>{let inf=stageInfo(id),open=id<=game.unlocked;return `<div class="item ${open?'':'locked'}"><div class="itemHead"><span>${String(id).padStart(2,'0')}. ${inf.name}</span><span class="muted">${inf.boss?'BOSS':'일반'}</span></div><div class="itemDesc">요구 레벨 ${inf.required} · 처치 목표 ${inf.target} · ${id%10===0?'대단원 보상':id%5===0?'보스 보상':'일반 파밍'}</div><div class="itemActions"><button class="smallbtn ${game.stage===id?'primary':''}" ${open&&player.level>=inf.required?'':'disabled'} onclick="startStage(${id})">${game.stage===id?'현재 지역':open?'입장':`Lv.${inf.required} / 해금 대기`}</button></div></div>`}).join('')}</div><div class="section"><h3>현재 진행</h3>${row('지역',`${game.stage}. ${current.name}`)}${row('처치',`${game.stageKills} / ${game.target}`)}${row('난이도',difficultyInfo().name)}${row('최고 도달',fmt(game.bestStage||game.unlocked))}${row('누적 처치',fmt(game.totalKills))}${row('이번 접속 획득 골드',fmt(game.sessionGold)+' G')}${game.stageCleared?'<button class="primary" style="width:100%;margin-top:8px" onclick="nextStage()">다음 스테이지</button>':'<div class="note">몬스터 목표 수를 달성하면 클리어됩니다.</div>'}</div>`}

function loadGame(show=true,rawOverride=null){const raw=rawOverride||safeGet(SAVE_KEY);if(!raw){if(show)log('저장 데이터가 없습니다.','warn');return}try{const d=JSON.parse(raw);Object.assign(player,d.player||{});player.gold=Math.max(0,Number(player.gold)||0);player.level=Math.max(1,Number(player.level)||1);player.traits=Object.assign({power:0,vitality:0,fortune:0},d.player?.traits||{});equipment=Object.assign({weapon:null,armor:null,helmet:null,gloves:null,boots:null,accessory:null},d.equipment||{});bag=Array.isArray(d.bag)?d.bag:[];materials=Object.assign({ember:0,core:0,dust:0},d.materials||{});mastery=Object.assign({might:0,ward:0,fortune:0},d.mastery||{});const savedSkills=d.skills||{};skills=Object.fromEntries(Object.entries(activeSkillDefs).map(([id,def])=>{const old=savedSkills[id]||{};return [id,{...def,level:Math.max(1,Math.min(def.max,Number(old.level)||1)),cd:0,learned:['q','e','r'].includes(id)?old.learned!==false:(old.learned===true),autoUse:old.autoUse!==false&&(['q','e','r'].includes(id)||old.autoUse===true)}]}));
 passives=Object.fromEntries(Object.entries(passiveSkillDefs).map(([id,def])=>{const old=(d.passives||{})[id]||{};return [id,{...def,level:Math.max(0,Math.min(def.max,Number(old.level)||0)),learned:old.learned===true}]}));
 skillLoadout={Q:'q',E:'e',R:'r',F:null,...(d.skillLoadout||{})};for(const slot of ['Q','E','R','F'])if(skillLoadout[slot]&&!skills[skillLoadout[slot]])skillLoadout[slot]=null;
 passiveLoadout=Array.isArray(d.passiveLoadout)?d.passiveLoadout.filter(id=>passives[id]?.learned).slice(0,3):[];
 Object.assign(game,d.game||{});game.codex=Array.isArray(game.codex)?game.codex:[];game.targetSlot=game.targetSlot||'any';if(game.targetSlot!=='any'&&!slots.some(([k])=>k===game.targetSlot))game.targetSlot='any';game.autoRepeat=d.game?.autoRepeat===true;game.autoSkills=d.game?.autoSkills!==false;game.stage=Math.max(1,Number(game.stage)||1);game.unlocked=Math.max(game.stage,Number(game.unlocked)||1);game.bestStage=Math.max(game.stage,Number(game.bestStage)||game.unlocked);game.difficulty=clamp(Number(game.difficulty)||0,0,2);game.target=Math.max(1,Number(game.target)||stageInfo().target);game.stageKills=clamp(Number(game.stageKills)||0,0,Math.max(0,game.target-1));game.stageCleared=false;game.autoHunt=d.game?.autoHunt!==false;game.autoLoot=d.game?.autoLoot!==false;game.autoNext=d.game?.autoNext!==false;game.autoSalvage=d.game?.autoSalvage||'off';if(!['off','common','uncommon','rare','epic'].includes(game.autoSalvage))game.autoSalvage='off';if(game.autoRepeat)game.autoNext=false;updateStats();enemies=[];drops=[];spawnWave();$('autoHunt').checked=game.autoHunt;$('autoNext').checked=game.autoNext;$('autoLoot').checked=game.autoLoot;$('autoSkills').checked=game.autoSkills!==false;$('autoRepeat').checked=game.autoRepeat===true;renderPanel();updateHud();if(show)log('저장 데이터를 불러왔습니다.','loot');const elapsed=Math.min(8*60*60,Math.max(0,(Date.now()-(d.savedAt||Date.now()))/1000));if(elapsed>120){const kills=Math.floor(elapsed/22);const xp=Math.floor(kills*(enemyDefs.wolf.exp+game.stage*3)*difficultyInfo().xp*.85),gold=Math.floor(kills*(enemyDefs.wolf.gold+game.stage*2)*difficultyInfo().loot*.9);player.gold+=gold;game.totalKills+=kills;const gearCount=Math.min(10,Math.floor(kills/42));let received=0;for(let i=0;i<gearCount;i++){const slot=rollDropSlot(),rk=rollRarity(false);receiveGear(createGear(slot,rk),'비접속 보상')}const dust=Math.floor(kills*.16),ember=Math.floor(kills*.018);materials.dust+=dust;materials.ember+=ember;gainXp(xp);showModal('접속하지 않은 동안의 보상',`최대 8시간 기준으로 계산했습니다.<br><b>${fmt(kills)}마리</b> 사냥 추정<br>경험치 +${fmt(xp)}<br>골드 +${fmt(gold)}G<br>장비 ${gearCount}개 · 분해 가루 +${fmt(dust)} · 잿불 +${fmt(ember)}`,[['받기',()=>{closeModal();updateHud();renderPanel();saveGame(false)},'primary']])}}catch(e){console.error(e);log('저장 데이터가 손상되어 불러오지 못했습니다.','warn')}}

function reportRuntimeError(where,err){
  const message=`${where}: ${err&&err.message?err.message:String(err)}`;
  if(message===lastRuntimeError)return;lastRuntimeError=message;
  console.error('[ASHEN PATH]',message,err);
  const note=$('runtimeNotice');if(note){note.style.display='block';note.textContent='전투 렌더링 보호 모드 · '+message;}
}
function loop(now){
  const dt=Math.min(.033,Math.max(0,(now-lastFrame)/1000));lastFrame=now;
  try{if(!paused)update(dt)}catch(err){paused=true;reportRuntimeError('업데이트 오류',err)}
  try{syncSceneFallback();draw()}catch(err){reportRuntimeError('화면 출력 오류',err)}
  if(typeof requestAnimationFrame==='function')requestAnimationFrame(loop);else setTimeout(()=>loop(performance.now()),16);
}

else if(v6Save){safeSet(SAVE_KEY,v6Save);loadGame(false,v6Save);log('v0.6 저장 데이터를 자동으로 이어받았습니다.','loot')}
