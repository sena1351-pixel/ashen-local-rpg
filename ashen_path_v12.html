<style>

parent;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;padding:2px;color:#c3bfb6;font-size:9px}.nav button b{font-size:17px;color:#dfc37c}.nav button.active{background:#302d27;border:1px solid #6d5e43;border-radius:5px}.overlay{position:fixed;z-index:10;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:#000b}.overlay.open{display:flex}.sheet{width:min(900px,100%);height:min(88dvh,800px);display:flex;flex-direction:column;overflow:hidden;border:1px solid #665b49;border-radius:10px;background:#171719;box-shadow:0 18px 70px #000}.sheet-head{min-height:52px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #45413a;background:#202021}.sheet-head strong{color:#ebd39c}.sheet-head button{font-size:20px;padding:3px 10px}.tabs{display:flex;overflow:auto;flex:none;border-bottom:1px solid #403d37}.tabs button{border:0;border-radius:0;white-space:nowrap;flex:1;padding:10px 6px;background:#1d1d1e;font-size:11px}.tabs button.active{background:#39342a;color:#f1d38d;box-shadow:inset 0 -2px #c5a15e}.content{flex:1;min-height:0;overflow:auto;padding:12px}.card{padding:11px;margin:0 0 9px;border:1px solid #3e3d3a;border-radius:7px;background:linear-gradient(145deg,#222224,#19191a)}.card h3{margin:0 0 9px;font-size:13px;color:#e5ca8d}.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #302f2d;font-size:11px;color:#c9c4ba}.row:last-child{border:0}.row b{color:#f3efe7}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.item{padding:9px;margin:6px 0;border:1px solid #46443f;border-radius:6px;background:#171719}.itemhead{display:flex;justify-content:space-between;gap:5px;font-weight:700;font-size:11px}.desc{font-size:10px;color:#aaa69d;line-height:1.55;margin-top:5px}.actions{flex-wrap:wrap}.item-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.item-actions button{font-size:10px;padding:6px 8px}.common{color:#d8d8d2}.uncommon{color:#83d28c}.rare{color:#83bdf2}.epic{color:#c89be8}.legendary{color:#f1c261}.equip{border-color:#9c804e;background:#29251d}.locked{opacity:.55}.baggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.bagitem{padding:8px;border:1px solid #514f4a;border-radius:6px;background:#151517;min-width:0}.bagitem .name{display:block;font-size:10px;margin:6px 0;overflow-wrap:anywhere}.bagitem small{font-size:9px;color:#aaa}.bagitem .desc{min-height:30px}.filter{display:flex;gap:5px;margin-bottom:8px}.filter button{flex:1;font-size:10px;padding:7px 3px}.filter button.active{border-color:#b99a5c;color:#f2d48e}.notice{font-size:10px;color:#a8a397;line-height:1.6}.progress{height:7px;background:#111;border-radius:5px;overflow:hidden}.progress i{display:block;height:100%;background:#d2ac61}.modal{position:fixed;z-index:30;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.dialog{width:min(420px,100%);padding:16px;background:#222;border:1px solid #8e7547;border-radius:8px}.dialog h3{margin:0;color:#f0d48e}.dialog p{font-size:12px;line-height:1.6;color:#ddd}.dialog-actions{display:flex;justify-content:flex-end;gap:7px}#toast{position:absolute;z-index:5;display:none;top:35%;left:50%;transform:translateX(-50%);padding:12px 18px;text-align:center;border:1px solid #9a7e4c;background:#171717ed;border-radius:7px;min-width:200px;color:#f1d38c}#toast small{display:block;color:#ddd;margin-top:4px}
@media(max-width:600px){.top{height:48px;padding:4px 7px;gap:5px}.logo{font-size:11px;letter-spacing:0}.res{font-size:9px;padding:4px}.res.hide-small{display:none}.top button{padding:6px;font-size:11px}.hud{left:7px;top:7px;width:43%;max-width:190px}.meter{height:12px;margin-bottom:3px}.meter span{font-size:8px;line-height:10px}.hudline{font-size:8px;gap:6px}.stage-label{top:7px;right:7px;font-size:9px}.badge{padding:3px 4px}.controls{inset:auto 7px 8px}.move button{width:44px;height:44px}.actions{gap:3px}.actions button{width:39px;height:39px}.actions button.attack{width:53px;height:53px}.auto{bottom:14px;font-size:9px;padding:6px 9px}.combatlog{left:6px;bottom:67px;font-size:9px}.lower{height:29px;font-size:9px;gap:8px}.nav{height:55px}.sheet{height:94dvh;border-radius:10px 10px 0 0}.overlay{padding:0;align-items:flex-end}.content{padding:8px}.card{padding:9px}.baggrid{grid-template-columns:repeat(2,minmax(0,1fr))}.tabs button{font-size:10px;padding:9px 5px}}

<body><div id="app">
<header class="top"><div class="logo">그림자 <em>유산</em> <small style="font:9px system-ui;color:#aaa">LOCAL IDLE RPG</small></div><div class="resources"><span class="res gold">◉ <b id="gold">0</b></span><span class="res hide-small">✦ <b id="dust">0</b></span><span class="res">◆ <b id="shard">0</b></span></div><button onclick="save(true)">저장</button><button onclick="fullscreen()">⛶</button></header>
<main class="main"><section class="scene"><canvas id="screen" width="480" height="270"></canvas><div class="hud"><div class="meter"><i id="hpbar"></i><span id="hp"></span></div><div class="meter mp"><i id="mpbar"></i><span id="mp"></span></div><div class="meter xp"><i id="xpbar"></i><span id="xp"></span></div><div class="hudline"><span>Lv <b id="level">1</b></span><span>전투력 <b id="power">0</b></span><span class="gold">코인 <b id="hudgold">0</b></span></div></div><div class="stage-label"><b id="stage">잿빛 들판</b><div style="margin-top:5px"><span class="badge" id="zone">지역 1</span><span class="badge" id="kills">0 / 8</span></div></div><div class="boss" id="boss"><span id="bossname">수문장</span><div class="bossbar"><i id="bossbar"></i></div></div><div class="combatlog" id="log"></div><div id="toast"><b id="toastTitle"></b><small id="toastText"></small></div><div class="controls"><div class="move"><button data-move="-1">◀</button><button data-move="1">▶</button></div><div class="actions"><button onclick="cast('1')">Ⅰ</button><button onclick="cast('2')">Ⅱ</button><button onclick="cast('3')">Ⅲ</button><button class="attack" data-attack>⚔</button></div></div><button class="auto on" id="auto" onclick="toggleAuto()">◉ 자동 사냥 ON</button></section><div class="lower"><label><input id="autoLoot" type="checkbox" checked> 자동 획득</label><label><input id="autoNext" type="checkbox" checked> 다음 지역</label><label><input id="autoSalvage" type="checkbox"> 일반 장비 자동 분해</label><span class="muted">← → 이동 · A 공격 · 1/2/3 기술</span></div></main>
<nav class="nav"><button data-menu="hero"><b>♙</b>영웅</button><button data-menu="gear"><b>⚒</b>장비</button><button data-menu="growth"><b>✧</b>성장</button><button data-menu="hunt"><b>⌖</b>사냥터</button><button data-menu="skills"><b>✦</b>기술</button><button data-menu="save"><b>▣</b>저장</button></nav></div>
<div class="overlay" id="overlay"><section class="sheet"><header class="sheet-head"><strong id="menuTitle">영웅</strong><button onclick="closeMenu()">×</button></header><nav class="tabs" id="tabs"></nav><section class="content" id="content"></section></section></div>
<div class="modal" id="modal"><section class="dialog"><h3 id="modalTitle"></h3><p id="modalText"></p><div class="dialog-actions" id="modalActions"></div></section></div>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('screen'),ctx=canvas.getContext('2d');
const SAVE_KEY='shadow_legacy_local_v1';
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),rand=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rand(a,b+1)),fmt=n=>Math.floor(n).toLocaleString('ko-KR');
const rarity={common:{name:'일반',cls:'common',mult:1},uncommon:{name:'고급',cls:'uncommon',mult:1.35},rare:{name:'희귀',cls:'rare',mult:1.8},epic:{name:'영웅',cls:'epic',mult:2.5},legendary:{name:'전설',cls:'legendary',mult:3.6}};
const slots=[['weapon','무기','⚔'],['armor','갑옷','▣'],['helm','투구','⛑'],['gloves','장갑','♜'],['boots','신발','⌁'],['ring','반지','◇']];
const zones=['잿빛 들판','낡은 성문','검은 숲길','돌무덤 골짜기','잊힌 사원','황혼의 성채','얼어붙은 길','붉은 황무지','무너진 왕도','심연의 입구'];
const enemiesDef=[{name:'들쥐 괴물',hp:50,atk:5,xp:10,gold:4,color:'#8b8b73'},{name:'숲의 망령',hp:85,atk:9,xp:16,gold:7,color:'#749188'},{name:'폐허 도적',hp:130,atk:13,xp:23,gold:10,color:'#a87959'},{name:'돌갑옷 병사',hp:205,atk:19,xp:34,gold:15,color:'#818795'},{name:'무덤 수호자',hp:310,atk:25,xp:50,gold:22,color:'#795d72'}];
const setDefs=[{id:'moss',name:'이끼 사냥꾼',atk:12,crit:.03},{id:'iron',name:'검은 철벽',def:10,hp:100},{id:'dusk',name:'황혼 추적자',atk:8,as:.08}];
const player={level:1,xp:0,xpNeed:100,gold:0,hp:180,maxHp:180,atk:18,def:5,crit:.04,as:1,points:0,traits:{might:0,guard:0,luck:0},potions:2};
let gear={weapon:null,armor:null,helm:null,gloves:null,boots:null,ring:null},bag=[],game={zone:1,best:1,kills:0,target:8,totalKills:0,auto:true,loot:true,autoNext:true,autoSalvage:false,paused:false,lastSeen:Date.now(),sessionKills:0},mats={dust:0,shard:0},enemy=null,drops=[],particles=[],menu='hero',menuTab='';
let input={left:false,right:false,attack:false},last=performance.now(),attackCd=0,attackFx=0,hitFlash=0,toastTimer=0;
function power(){return Math.floor(player.atk*2+player.def*1.6+player.maxHp*.12+player.crit*100+player.as*12)}
function recalc(){let atk=15+player.level*2+player.traits.might*3,def=3+player.traits.guard*1.3,hp=160+player.level*20+player.traits.guard*12,crit=.035+player.traits.luck*.004,as=1;let sets={};for(const it of Object.values(gear)){if(!it)continue;atk+=it.stats.atk||0;def+=it.stats.def||0;hp+=it.stats.hp||0;crit+=it.stats.crit||0;as+=it.stats.as||0;if(it.set)sets[it.set]=(sets[it.set]||0)+1}for(const s of setDefs){const count=sets[s.id]||0;if(count>=2){atk+=s.atk||0;def+=s.def||0;hp+=s.hp||0;crit+=s.crit||0;as+=s.as||0}}player.atk=Math.floor(atk);player.def=Math.floor(def);player.maxHp=Math.floor(hp);player.crit=Math.min(.75,crit);player.as=Math.min(2.5,as);player.hp=clamp(player.hp,1,player.maxHp)}
function log(text,cls=''){let el=document.createElement('div');el.className=cls;el.textContent=text;$('log').prepend(el);while($('log').children.length>3)$('log').lastChild.remove()}
function toast(title,text){$('toastTitle').textContent=title;$('toastText').textContent=text;$('toast').style.display='block';toastTimer=2}
function rollRarity(boss=false){let r=Math.random();if(boss&&r<.18)return'legendary';if(r<.012)return'legendary';if(r<.06)return'epic';if(r<.19)return'rare';if(r<.48)return'uncommon';return'common'}
function makeGear(forceSlot=null,forceRarity=null){let slot=forceSlot||slots[ri(0,slots.length-1)][0],rar=forceRarity||rollRarity(),mult=rarity[rar].mult*(1+Math.max(0,game.zone-1)*.08);let item={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),slot,rarity:rar,level:player.level,set:Math.random()<(rar==='legendary'?.35:rar==='epic'?.2:.04)?setDefs[ri(0,2)].id:null,locked:false,stats:{}};if(slot==='weapon')item.stats.atk=Math.round((8+player.level*2)*mult);else if(slot==='armor')Object.assign(item.stats,{def:Math.round((4+player.level)*mult),hp:Math.round((18+player.level*5)*mult)});else if(slot==='helm')Object.assign(item.stats,{def:Math.round((2+player.level*.6)*mult),hp:Math.round((10+player.level*3)*mult)});else if(slot==='gloves')Object.assign(item.stats,{atk:Math.round((2+player.level)*mult),as:Number((rand(.01,.05)*mult).toFixed(3))});else if(slot==='boots')Object.assign(item.stats,{def:Math.round((2+player.level*.4)*mult),hp:Math.round((8+player.level*2)*mult)});else Object.assign(item.stats,{hp:Math.round((10+player.level*4)*mult),crit:Number((rand(.004,.016)*mult).toFixed(3))});if(rar==='epic'||rar==='legendary')item.stats.crit=Number(((item.stats.crit||0)+rand(.008,.025)*mult).toFixed(3));return item}
function score(it){if(!it)return 0;let s=it.stats;return(s.atk||0)*2+(s.def||0)*2+(s.hp||0)*.12+(s.crit||0)*400+(s.as||0)*200+(rarity[it.rarity]?.mult||1)*8}
function statsText(it){let s=it.stats,p=[];if(s.atk)p.push(`공격 +${s.atk}`);if(s.def)p.push(`방어 +${s.def}`);if(s.hp)p.push(`HP +${s.hp}`);if(s.crit)p.push(`치명 +${(s.crit*100).toFixed(1)}%`);if(s.as)p.push(`공속 +${(s.as*100).toFixed(1)}%`);return p.join(' · ')}
function receive(item,source='획득'){if(game.autoSalvage&&item.rarity==='common'){mats.dust+=3;log('일반 장비 자동 분해 · 가루 +3','gold');return}if(bag.length>=90){mats.dust+=3;log('가방 가득 참 · 장비 자동 분해','bad');return}bag.unshift(item);log(`${rarity[item.rarity].name} 장비 ${source}`,'good');if(item.rarity==='legendary')toast('전설 장비 발견!',itemName(item))}
const itemName=it=>`${slots.find(s=>s[0]===it.slot)?.[2]||'◇'} ${setDefs.find(s=>s.id===it.set)?.name||['낡은','수호자의','황혼의','검은'][ri(0,3)]+' '+slots.find(s=>s[0]===it.slot)?.[1]}`;
function spawn(){let boss=game.zone%5===0,base=enemiesDef[Math.min(4,Math.floor((game.zone-1)/2))];let mult=1+(game.zone-1)*.17;enemy={name:boss?`지역 수문장 ${Math.ceil(game.zone/5)}`:base.name,hp:Math.floor((boss?base.hp*8:base.hp)*mult),maxHp:Math.floor((boss?base.hp*8:base.hp)*mult),atk:Math.floor((boss?base.atk*1.7:base.atk)*mult),xp:boss?base.xp*8:base.xp,gold:boss?base.gold*8:base.gold,color:boss?'#a44750':base.color,boss,x:boss?380:330+ri(0,100),cd:1,wind:0,dead:false}}
function stageStart(z){game.zone=Math.max(1,z);game.kills=0;game.target=game.zone%5===0?1:8+Math.floor(game.zone/5)*2;enemy=null;drops=[];spawn();recalc();log(`${game.zone}지역 · ${zones[(game.zone-1)%zones.length]} 진입`,'gold');save(false);hud()}
function killEnemy(){if(!enemy||enemy.dead)return;enemy.dead=true;game.kills++;game.totalKills++;game.sessionKills++;let xp=Math.floor(enemy.xp*(1+game.zone*.1)),gold=Math.floor(enemy.gold*(1+game.zone*.09));player.xp+=xp;player.gold+=gold;while(player.xp>=player.xpNeed){player.xp-=player.xpNeed;player.level++;player.points+=2;player.xpNeed=Math.floor(95*Math.pow(1.22,player.level-1));player.hp=player.maxHp;recalc();toast('레벨 상승',`영웅 Lv.${player.level} · 특성 포인트 +2`)}if(Math.random()<(enemy.boss?.98:.27+Math.min(.2,game.zone*.008))){let item=makeGear(null,rollRarity(enemy.boss));drops.push({item,x:enemy.x,life:18});if(game.loot)pickup()}if(enemy.boss){mats.shard+=2;mats.dust+=12;toast('수문장 격파',`장비 파편 +2 · 분해 가루 +12`);game.best=Math.max(game.best,game.zone+1);if(game.autoNext)stageStart(game.zone+1)}else if(game.kills>=game.target){game.best=Math.max(game.best,game.zone+1);toast('사냥 구역 완료',`${game.target}마리 처치 · 다음 지역 개방`);if(game.autoNext)stageStart(game.zone+1);else{game.kills=0;spawn()}}else spawn();hud();save(false)}
function pickup(){for(let i=drops.length-1;i>=0;i--){let d=drops[i];if(game.loot||Math.abs(d.x-120)<25){receive(d.item);drops.splice(i,1)}}}
function hit(){if(!enemy||enemy.dead||attackCd>0)return;attackCd=.62/player.as;attackFx=.24;let distance=Math.abs(enemy.x-120);if(distance<150){let damage=Math.max(1,Math.floor(player.atk*(Math.random()<player.crit?2:1)-enemy.atk*.08));enemy.hp-=damage;particles.push({x:enemy.x,y:174,text:String(damage),life:.8});if(enemy.hp<=0)killEnemy()}}
function cast(n){if(!enemy||enemy.dead)return;let cost=20,now=Date.now();if(player.mana<cost){player.mana=100}let multiplier=n==='1'?2.8:n==='2'?2:n==='3'?3.8:2;let d=Math.max(1,Math.floor(player.atk*multiplier-enemy.atk*.05));enemy.hp-=d;particles.push({x:enemy.x,y:160,text:`✦${d}`,life:1});if(enemy.hp<=0)killEnemy();hud()}
function toggleAuto(){game.auto=!game.auto;$('auto').classList.toggle('on',game.auto);$('auto').textContent=game.auto?'◉ 자동 사냥 ON':'○ 자동 사냥 OFF';save(false)}
function draw(){let w=480,h=270;ctx.clearRect(0,0,w,h);let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#1d2931');sky.addColorStop(.7,'#343638');sky.addColorStop(1,'#18191a');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);ctx.fillStyle='#ded5b7';ctx.globalAlpha=.7;ctx.fillRect(390,35,22,22);ctx.globalAlpha=1;ctx.fillStyle='#24282c';ctx.beginPath();ctx.moveTo(0,188);ctx.lineTo(72,92);ctx.lineTo(132,177);ctx.lineTo(228,75);ctx.lineTo(310,180);ctx.lineTo(420,98);ctx.lineTo(480,174);ctx.lineTo(480,228);ctx.lineTo(0,228);ctx.fill();ctx.fillStyle='#292826';ctx.fillRect(0,228,w,42);ctx.fillStyle='#857a66';ctx.fillRect(0,227,w,3);for(let i=0;i<38;i++){ctx.fillStyle=i%2?'#393732':'#49463f';ctx.fillRect((i*73)%480,235+(i*29)%34,3,2)}drawHero();if(enemy&&!enemy.dead)drawEnemy();for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=.025;p.y-=.7;ctx.fillStyle='#ffe199';ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);if(p.life<=0)particles.splice(i,1)}if(game.paused){ctx.fillStyle='#0009';ctx.fillRect(0,0,w,h);ctx.fillStyle='white';ctx.font='bold 22px monospace';ctx.textAlign='center';ctx.fillText('PAUSED',240,140)}}
function drawHero(){let x=120,y=228;ctx.fillStyle='#111';ctx.fillRect(x-9,y-2,19,3);let bob=input.left||input.right?Math.sin(performance.now()/55)*2:0;ctx.fillStyle='#27272b';ctx.fillRect(x-7,y-20+bob,5,19);ctx.fillRect(x+2,y-20-bob,5,19);ctx.fillStyle='#75514c';ctx.fillRect(x-10,y-40,20,20);ctx.fillStyle='#c19a67';ctx.fillRect(x-10,y-24,20,4);ctx.fillStyle='#d5ad8a';ctx.fillRect(x-7,y-52,14,13);ctx.fillStyle='#242126';ctx.fillRect(x-8,y-56,17,6);ctx.fillStyle='#e1ddd2';ctx.fillRect(x+3,y-48,2,2);ctx.fillStyle='#b9bdc2';ctx.fillRect(x+12,y-39,3,24);if(attackFx>0){ctx.strokeStyle='#e7d28f';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+14,y-28,24,-.9,.8);ctx.stroke()}}
function drawEnemy(){if(!enemy)return;let x=enemy.x,y=228,s=enemy.boss?34:24;ctx.fillStyle='#111';ctx.fillRect(x-s/2,y-enemy.hp/enemy.maxHp*5-15,s,4);ctx.fillStyle='#b44d56';ctx.fillRect(x-s/2,y-enemy.hp/enemy.maxHp*5-15,s*clamp(enemy.hp/enemy.maxHp,0,1),4);ctx.fillStyle=enemy.color;ctx.fillRect(x-s/2,y-s-12,s,s+8);ctx.fillStyle='#d6c8ad';ctx.fillRect(x-s*.25,y-s-19,s*.5,9);ctx.fillStyle='#151515';ctx.fillRect(x-5,y-s-15,3,3);ctx.fillRect(x+3,y-s-15,3,3);ctx.fillStyle='#f0e5d0';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText(enemy.name,x,y-s-25);if(enemy.boss){$('boss').style.display='block';$('bossname').textContent=enemy.name;$('bossbar').style.width=(enemy.hp/enemy.maxHp*100)+'%'}else $('boss').style.display='none'}
function hud(){recalc();$('gold').textContent=fmt(player.gold);$('hudgold').textContent=fmt(player.gold);$('dust').textContent=fmt(mats.dust);$('shard').textContent=fmt(mats.shard);$('level').textContent=player.level;$('power').textContent=fmt(power());$('hp').textContent=`HP ${fmt(player.hp)} / ${fmt(player.maxHp)}`;$('mp').textContent=`지역 경험 ${fmt(player.xp)} / ${fmt(player.xpNeed)}`;$('xp').textContent=`EXP ${fmt(player.xp)} / ${fmt(player.xpNeed)}`;$('hpbar').style.width=(player.hp/player.maxHp*100)+'%';$('mpbar').style.width='100%';$('xpbar').style.width=(player.xp/player.xpNeed*100)+'%';$('stage').textContent=zones[(game.zone-1)%zones.length];$('zone').textContent=`지역 ${game.zone}`;$('kills').textContent=`${game.kills} / ${game.target}`;$('autoLoot').checked=game.loot;$('autoNext').checked=game.autoNext;$('autoSalvage').checked=game.autoSalvage}
function loop(now){let dt=Math.min(.04,(now-last)/1000);last=now;if(!game.paused){attackCd=Math.max(0,attackCd-dt);attackFx=Math.max(0,attackFx-dt);hitFlash=Math.max(0,hitFlash-dt);if(game.auto){if(enemy&&!enemy.dead){if(Math.abs(enemy.x-120)>90)enemy.x+=(enemy.x>120?-1:1)*55*dt;else if(attackCd<=0)hit()}}if(input.left)enemy&&(enemy.x=Math.min(450,enemy.x+90*dt));if(input.right)enemy&&(enemy.x=Math.max(30,enemy.x-90*dt));if(input.attack&&attackCd<=0)hit();if(enemy&&!enemy.dead){enemy.cd-=dt;if(Math.abs(enemy.x-120)<48&&enemy.cd<=0){let dmg=Math.max(1,enemy.atk-player.def*.35);player.hp-=dmg;enemy.cd=1.4;particles.push({x:120,y:170,text:`-${Math.floor(dmg)}`,life:.7});if(player.hp<=0){player.hp=Math.max(1,Math.floor(player.maxHp*.6));enemy.x=380;toast('쓰러졌습니다','거점에서 회복하여 다시 도전합니다.')}}}if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').style.display='none'}pickup();if(!enemy||enemy.dead)spawn();hud()}draw();requestAnimationFrame(loop)}
function setTrait(k){if(player.points<=0)return;player.points--;player.traits[k]++;recalc();renderMenu();hud();save(false)}
function equip(id){let it=bag.find(x=>x.id===id);if(!it)return;let old=gear[it.slot];gear[it.slot]=it;bag=bag.filter(x=>x.id!==id);if(old)bag.unshift(old);recalc();renderMenu();hud();save(false);log(`${itemName(it)} 장착`,'good')}
function salvage(id){let i=bag.findIndex(x=>x.id===id);if(i<0||bag[i].locked)return;let it=bag.splice(i,1)[0];let rank=['common','uncommon','rare','epic','legendary'].indexOf(it.rarity);mats.dust += [3,6,12,25,50][rank];mats.shard+=rank>=2?1:0;renderMenu();hud();save(false);log('장비 분해 · 성장 재료 획득','gold')}
function lockItem(id){let it=bag.find(x=>x.id===id);if(it){it.locked=!it.locked;renderMenu();save(false)}}
function enhance(slot){let it=gear[slot];if(!it)return;let cost=30*Math.pow(1+(it.enhance||0),2);if(player.gold<cost){log('골드가 부족합니다.','bad');return}if((it.enhance||0)>=15)return;player.gold-=cost;it.enhance=(it.enhance||0)+1;for(let k in it.stats)it.stats[k]=Number((it.stats[k]*1.09).toFixed(2));recalc();renderMenu();hud();save(false);log(`${itemName(it)} +${it.enhance} 강화`,'gold')}

function openMenu(m){menu=m;let first={hero:'정보',gear:'장비',growth:'성장',hunt:'지역',skills:'설명',save:'저장'};menuTab=first[m];renderMenu()}
function closeMenu(){$('overlay').classList.remove('open')}
function save(show=false){try{game.lastSeen=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify({version:1,player,gear,bag,mats,game}));if(show)log('이 기기에 저장했습니다.','good')}catch(e){if(show)log('저장 공간에 접근할 수 없습니다.','bad')}}
function load(){try{let raw=localStorage.getItem(SAVE_KEY);if(!raw)return;let d=JSON.parse(raw);if(!d||d.version!==1)return;Object.assign(player,d.player||{});player.traits=Object.assign({might:0,guard:0,luck:0},d.player?.traits||{});gear=Object.assign(gear,d.gear||{});bag=Array.isArray(d.bag)?d.bag:[];mats=Object.assign(mats,d.mats||{});game=Object.assign(game,d.game||{});let elapsed=Math.min(8*3600,Math.max(0,(Date.now()-(d.game?.lastSeen||Date.now()))/1000));if(elapsed>90){let kills=Math.floor(elapsed/22),xp=Math.floor(kills*(12+game.zone*2)),gold=Math.floor(kills*(5+game.zone));player.xp+=xp;player.gold+=gold;game.totalKills+=kills;game.sessionKills+=kills;let gearCount=Math.min(8,Math.floor(kills/30));for(let i=0;i<gearCount;i++)receive(makeGear());let dust=Math.floor(kills*.12);mats.dust+=dust;while(player.xp>=player.xpNeed){player.xp-=player.xpNeed;player.level++;player.points+=2;player.xpNeed=Math.floor(95*Math.pow(1.22,player.level-1))}setTimeout(()=>alert(`오프라인 사냥 보상\n약 ${fmt(kills)}마리 처치\n경험치 +${fmt(xp)} · 골드 +${fmt(gold)}\n장비 ${gearCount}개 · 가루 +${dust}`),350)}recalc()}catch(e){console.warn('Save data could not be loaded',e)}}
function exportSave(){save(false);let blob=new Blob([localStorage.getItem(SAVE_KEY)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shadow-legacy-save.json';a.click();URL.revokeObjectURL(a.href)}
function importSave(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(d.version!==1)throw Error();localStorage.setItem(SAVE_KEY,JSON.stringify(d));location.reload()}catch(e){alert('올바른 저장 파일이 아닙니다.')}};r.readAsText(file)}
function resetGame(){if(!confirm('이 기기의 진행 데이터를 삭제하고 새로 시작할까요?'))return;localStorage.removeItem(SAVE_KEY);location.reload()}
function fullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.()}
function togglePause(){game.paused=!game.paused;log(game.paused?'일시정지':'전투 재개')}
function release(){input.left=input.right=input.attack=false}
document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>openMenu(b.dataset.menu));document.querySelectorAll('[data-move]').forEach(b=>{let k=b.dataset.move==='-1'?'left':'right';b.onpointerdown=e=>{e.preventDefault();input[k]=true;b.setPointerCapture?.(e.pointerId)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>input[k]=false});let attack=document.querySelector('[data-attack]');attack.onpointerdown=e=>{e.preventDefault();input.attack=true;attack.setPointerCapture?.(e.pointerId)};attack.onpointerup=attack.onpointercancel=attack.onlostpointercapture=()=>input.attack=false;
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space','KeyA','Digit1','Digit2','Digit3'].includes(e.code))e.preventDefault();if(e.code==='Escape'){closeMenu();return}if(e.code==='ArrowLeft')input.left=true;if(e.code==='ArrowRight')input.right=true;if(e.code==='KeyA'||e.code==='Space')input.attack=true;if(e.code==='Digit1')cast('1');if(e.code==='Digit2')cast('2');if(e.code==='Digit3')cast('3')});window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft')input.left=false;if(e.code==='ArrowRight')input.right=false;if(e.code==='KeyA'||e.code==='Space')input.attack=false});window.addEventListener('blur',release);document.addEventListener('visibilitychange',()=>{if(document.hidden){release();save(false)}});
$('auto').onclick=toggleAuto;$('autoLoot').onchange=e=>{game.loot=e.target.checked;save(false)};$('autoNext').onchange=e=>{game.autoNext=e.target.checked;save(false)};$('autoSalvage').onchange=e=>{game.autoSalvage=e.target.checked;save(false)};$('overlay').onclick=e=>{if(e.target===$('overlay'))closeMenu()};
load();recalc();if(!enemy)spawn();hud();document.querySelectorAll('[data-menu="hero"]').forEach(x=>x.classList.add('active'));setInterval(()=>save(false),10000);window.addEventListener('beforeunload',()=>save(false));requestAnimationFrame(loop);
</script></body></html>
